<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>과목별 음원 검증</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171a20;color:#eee;font:14px system-ui;letter-spacing:0}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:24px}a{color:#8edcce}button,select{font:inherit;border:1px solid #56606c;border-radius:4px;padding:9px;background:#292e38;color:#fff;min-width:0}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#246c57}label{display:flex;gap:8px;align-items:center}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}#days{display:flex;gap:12px;flex-wrap:wrap;max-height:160px;overflow:auto;padding:12px 0}.table-wrap{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%;min-width:780px;table-layout:fixed}td,th{padding:12px;border-bottom:1px solid #414752;text-align:left;overflow-wrap:anywhere;vertical-align:top}th{background:#242933;position:sticky;top:0}audio{width:100%;min-width:140px}.review{color:#ffd16c}.mismatch_candidate{color:#ff9292}.match{color:#77deae}#notice{color:#ffd16c;min-height:22px}#preview{max-height:160px;overflow:auto}#summary{font-weight:600}small{color:#b5bcc7}@media(max-width:600px){main{padding:12px}label select{max-width:160px}}
</style></head><body><main>
<a href="/">테스트 실행</a><h1>과목별 음원 검증</h1>
<div class="toolbar"><label>과목 <select id="subject" disabled></select></label><span id="subjectState"></span></div>
<small>서버 원본 음원 대조 · 로컬 Whisper · 실제 스피커 출력 검증 아님 · Redmine 미연결</small>
<div class="toolbar"><label><span id="levelLabel">Level</span> <select id="level" disabled></select></label><label><span id="weekLabel">Week</span> <select id="week" disabled></select></label><label><input type="checkbox" id="allDays" checked><span id="unitLabel">Day 전체</span></label><button id="previewButton" disabled>검사 대상 미리보기</button></div>
<div id="days"></div><div id="preview"></div>
<div class="toolbar"><button id="start" class="primary" disabled>▶ 선택 단원 검사</button><button id="stop" disabled>■ 중지</button><button id="resume" disabled>↻ 미완료 이어서 검사</button><button id="json" disabled>↓ JSON</button><button id="excel" disabled>↓ Excel</button></div>
<p id="notice" role="status"></p><p id="state">대기</p><p id="summary"></p><p id="capture"></p>
<div class="toolbar"><label>실행 이력 <select id="history"><option value="">현재 회차</option></select></label><label>단원 <select id="unitFilter"><option value="">전체</option></select></label><label>판정 <select id="statusFilter"><option value="">전체</option><option value="match">일치</option><option value="mismatch_candidate">불일치 후보</option><option value="review">검토 필요</option><option value="unavailable">검사 불가</option></select></label></div>
<div class="table-wrap"><table><thead><tr><th>단원 / 항목</th><th>화면 문구</th><th>음성에서 인식한 문장</th><th>판정과 이유</th><th>음원</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script>
const token='__TOKEN__',base='/api/audio-verification',$=id=>document.getElementById(id);
let catalog=[],preview=null,current=null,active=null,busy=false,stopping=false,signature='',historyId='';
const urls=new Map();
let subjects=[],subject='japanese',loadVersion=0;
const subjectOf=x=>x?.subject||'japanese';
const labels={match:'일치',review:'검토 필요',mismatch_candidate:'불일치 후보 · 승인 전',unavailable:'검사 불가'};
const stages={word:'단어 학습',sentence:'문장 학습',conversation:'회화 학습',other:'기타'};
for(const name of ['쓰기','이해','연습','퀴즈'])stages[name]=name;
for(const name of ['Step 2. 발음 학습','Step 3. 발음 연습','Step 4. 발음 완성'])stages[name]=name;
for(const name of ['Step 1. 어휘','Step 2. 연습','Step 3. 연습','Step 3. 실전','Step 4. 실전','체크인'])stages[name]=name;
const states={pending:'대기',running:'검사 중',finished:'검사 완료',stopped:'중지됨',failed:'검사 실패',unavailable:'검사 불가'};
const reasons={'Short utterance requires listening review':'음성이 짧아 정확한 인식이 어려울 수 있습니다. 직접 듣고 확인해 주세요.','Spelling or speech recognition ambiguity':'표기 차이인지 음성 인식 오류인지 확실하지 않습니다. 직접 듣고 확인해 주세요.','Normalized transcript matches display text':'숫자 표기와 문장부호 차이를 제외하면 화면 문구와 일치합니다.','Numeric content differs; confirm by listening':'숫자가 다릅니다. 직접 듣고 확인해 주세요.','Question/statement differs; confirm by listening':'질문·설명 형식이 다릅니다. 직접 듣고 확인해 주세요.','Missing text, transcript or audio':'문구, 인식 결과 또는 음원이 없어 검사할 수 없습니다.','Audio download, decoding or transcription failed':'음원 다운로드 또는 음성 인식에 실패했습니다.'};
async function api(path='',body){const r=await fetch(base+path,{method:body===undefined?'GET':'POST',headers:{'X-QA-CSRF-Token':token,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});if(!r.ok){let d={};try{d=await r.json();}catch{}throw Error(d.error||'요청 실패 '+r.status);}return r;}
async function asset(id,name){const k=id+'/'+name;if(!urls.has(k))urls.set(k,URL.createObjectURL(await(await api('/'+k)).blob()));return urls.get(k);}
function option(value,text){return new Option(text,value);}
function invalidate(){preview=null;$('preview').replaceChildren();sync();}
function range(){return catalog.filter(u=>(!$('level').value||String(u.level)===$('level').value)&&(!$('week').value||String(u.week)===$('week').value));}
function days(){invalidate();$('days').replaceChildren();for(const u of range()){const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=true;box.value=u.key;box.onchange=()=>{$('allDays').checked=[...$('days').querySelectorAll('input')].every(x=>x.checked);invalidate();};label.append(box,document.createTextNode(u.label||u.key));$('days').append(label);}$('allDays').checked=true;}
function weeks(){const prev=$('week').value;$('week').replaceChildren(option('','전체'));const list=[...new Set(catalog.filter(u=>!$('level').value||String(u.level)===$('level').value).map(u=>u.week))].sort((a,b)=>a-b);for(const w of list)$('week').append(option(w,(subject==='travel-english'?'그룹 ':'Week ')+w));if(list.includes(Number(prev)))$('week').value=prev;days();}
function sync(){const running=active?.status==='running';$('subject').disabled=busy||running||!subjects.length;for(const id of ['level','week','allDays','previewButton'])$(id).disabled=busy||running||!catalog.length;for(const x of $('days').querySelectorAll('input'))x.disabled=busy||running;$('start').disabled=busy||running||!preview?.total;$('stop').disabled=!running||stopping;$('resume').disabled=busy||running||subjectOf(active)!==subject||!['failed','stopped'].includes(active?.status)||!(active?.units||[]).some(u=>u.items.some(x=>x.status==='pending'));for(const id of ['json','excel'])$(id).disabled=!current||current.status==='running';}
async function histories(){const selected=subject,d=await(await api('/history?subject='+encodeURIComponent(selected))).json();if(subject!==selected)return;$('history').replaceChildren(option('','현재 회차'));for(const x of d.runs)$('history').append(option(x.id,x.subject_name+' · '+(x.started_at||x.id)+' · '+(states[x.status]||x.status)));$('history').value=historyId;}
function counts(c){const n=c.counts||c.items.reduce((a,x)=>(a[x.status]=(a[x.status]||0)+1,a),{});return ['match','mismatch_candidate','review','unavailable'].map(k=>labels[k]+': '+(n[k]||0)).join(' / ');}
async function render(){if(!current){$('rows').replaceChildren();$('capture').replaceChildren();$('summary').textContent='';$('state').textContent='선택 과목의 현재 실행 결과 없음';return;}const c=current,key=[c.id,c.status,c.items.length,$('unitFilter').value,$('statusFilter').value].join('|');$('state').textContent=(c.subject_name||'더위크 일본어')+' · '+(states[c.status]||c.status)+' · '+c.items.length+'/'+c.total+' · '+(c.active_unit||'')+(c.active_index?' · 항목 '+c.active_index:'');$('summary').textContent=counts(c);if(key===signature)return;signature=key;
const prev=$('unitFilter').value;$('unitFilter').replaceChildren(option('','전체'));for(const u of c.units||[])$('unitFilter').append(option(u.key,u.key+' · '+(states[u.status]||u.status)));$('unitFilter').value=prev;
$('rows').replaceChildren();for(const x of c.items){if(prev&&x.unit!==prev||$('statusFilter').value&&x.status!==$('statusFilter').value)continue;const tr=document.createElement('tr');tr.className=x.status;for(const text of [(x.unit||'L2-W3-D3')+' / '+x.index+' · '+(stages[x.stage]||x.stage||'기타'),x.expected,x.transcript,(labels[x.status]||x.status)+' · '+(reasons[x.reason]||'판정 근거 확인 필요')]){const td=document.createElement('td');td.textContent=text||'-';tr.append(td);}const td=document.createElement('td');if(x.audio){const b=document.createElement('button');b.textContent='▶ 음원 듣기';b.onclick=async()=>{b.disabled=true;try{const a=document.createElement('audio');a.controls=true;a.src=await asset(c.id,x.audio);td.replaceChildren(a);await a.play();}catch(e){b.disabled=false;$('notice').textContent=e.message;}};td.append(b);}tr.append(td);$('rows').append(tr);}
$('capture').replaceChildren();if(c.capture){const a=document.createElement('a');a.textContent='실행 시작 시 기기 화면 (단원별 증거 아님)';a.href=await asset(c.id,c.capture);a.target='_blank';$('capture').append(a);}for(const u of c.units||[]){if(u.error){const p=document.createElement('p');p.textContent=u.key+': '+u.error;$('capture').append(p);}}if(c.error){const p=document.createElement('p');p.textContent=c.error==='Server restarted'?'서버 재시작으로 중단됨':'검사 환경 또는 결과 저장 오류';$('capture').append(p);}}
async function refresh(){try{const d=await(await api()).json();const old=active?.status;active=d.current;if(!historyId)current=active&&subjectOf(active)===subject?active:null;if(active?.status!=='running')stopping=false;await render();sync();if(old==='running'&&active?.status!=='running')await histories();}catch(e){$('notice').textContent='상태 확인 지연: '+e.message;}}
$('level').onchange=weeks;$('week').onchange=days;$('allDays').onchange=()=>{for(const x of $('days').querySelectorAll('input'))x.checked=$('allDays').checked;invalidate();};
$('previewButton').onclick=async()=>{busy=true;sync();$('notice').textContent='단원별 음원 목록 수집 중';try{preview=await(await api('/preview',{subject,units:[...$('days').querySelectorAll('input:checked')].map(x=>x.value)})).json();$('preview').replaceChildren();for(const u of preview.units){const p=document.createElement('p');p.textContent=(u.label||u.key)+' · '+u.items.length+'개'+(u.error?' · '+u.error:'');$('preview').append(p);}$('notice').textContent=preview.units.length+'개 단원 / '+preview.total+'개 음원';}catch(e){preview=null;$('notice').textContent=e.message;}finally{busy=false;sync();}};
async function start(path,body){busy=true;sync();try{await api(path,body);historyId='';$('history').value='';$('unitFilter').value='';signature='';$('notice').textContent='';await refresh();await histories();}catch(e){$('notice').textContent=e.message;}finally{busy=false;sync();}}
$('start').onclick=()=>start('',{subject,preview_id:preview.preview_id});$('resume').onclick=()=>start('/resume',{});
$('stop').onclick=async()=>{stopping=true;sync();$('notice').textContent='중단 처리 중 · 현재 음성 인식 반환 후 중지';try{await api('/stop',{});}catch(e){stopping=false;$('notice').textContent=e.message;sync();}};
for(const [id,file,ext] of [['json','result.json','json'],['excel','export','xlsx']])$(id).onclick=async()=>{try{const a=document.createElement('a');a.href=await asset(current.id,file);a.download='audio-'+current.id+'.'+ext;a.click();}catch(e){$('notice').textContent=e.message;}};
$('history').onchange=async()=>{const selected=subject,id=$('history').value;historyId=id;try{const result=id?await(await api('/'+id+'/result.json')).json():active;if(selected!==subject||historyId!==id)return;current=result&&subjectOf(result)===subject?result:null;signature='';$('unitFilter').value='';await render();sync();}catch(e){$('notice').textContent=e.message;}};
for(const id of ['unitFilter','statusFilter'])$(id).onchange=()=>{signature='';render();};
async function poll(){await refresh();setTimeout(poll,2000);}poll();
async function selectSubject(){const version=++loadVersion;subject=$('subject').value;busy=true;$('week').parentElement.style.display=subject==='toeic'?'none':'';$('levelLabel').textContent=['travel-english','toeic'].includes(subject)?'과정':'Level';$('weekLabel').textContent=subject==='travel-english'?'그룹':'Week';catalog=[];preview=null;current=null;historyId='';signature='';$('preview').replaceChildren();$('days').replaceChildren();$('unitFilter').replaceChildren(option('','전체'));$('history').replaceChildren(option('','현재 회차'));$('unitLabel').textContent=(subjects.find(s=>s.id===subject)?.unit_label||'Day')+' 전체';$('notice').textContent='과목 단원 목록 확인 중';sync();await render();try{const d=await(await api('/catalog?subject='+encodeURIComponent(subject))).json();if(version!==loadVersion)return;catalog=d.units;$('level').replaceChildren(option('','전체'));for(const l of [...new Set(catalog.map(u=>u.level))])$('level').append(option(l,subjects.find(s=>s.id===subject)?.level_names?.[String(l)]||'Level '+l));$('level').value=String(catalog[0]?.level||'');weeks();$('week').value=String(range()[0]?.week||'');days();$('subjectState').textContent=catalog.length+'개 검사 단원';$('notice').textContent='';await histories();await refresh();}catch(e){$('notice').textContent=e.message;}finally{if(version===loadVersion){busy=false;sync();}}}
$('subject').onchange=selectSubject;
(async()=>{try{subjects=(await(await api('/subjects')).json()).subjects;for(const s of subjects)$('subject').append(option(s.id,s.name));await selectSubject();}catch(e){$('notice').textContent=e.message;}})();
</script></body></html>
